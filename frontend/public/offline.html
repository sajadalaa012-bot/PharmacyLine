<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>velina</title>
    <link rel="manifest" href="/manifest.json" />
    <style>
      /* The shop's own tokens, copied rather than imported: this page has to
         render with no network at all, so it cannot pull a stylesheet. */
      :root {
        --paper: #f3f7fb;
        --surface: #ffffff;
        --line: #dce8f3;
        --ink: #1b2733;
        --ink-2: #4e5f70;
        --ink-3: #77899b;
        --brand: #c62a6c;
        --on-brand: #ffffff;
        color-scheme: light;
      }
      /* The theme toggle writes .dark on <html> and this page reads it, so
         someone browsing at night does not get a white flash when the signal
         drops. */
      html.dark {
        --paper: #101720;
        --surface: #18212c;
        --line: #26333f;
        --ink: #eaf1f8;
        --ink-2: #b3c4d4;
        --ink-3: #7d90a2;
        --brand: #f56ba1;
        --on-brand: #3d0a22;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      .card {
        width: 100%;
        max-width: 22rem;
        padding: 40px 28px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 24px 60px -34px rgb(0 0 0 / 0.35);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: color-mix(in oklab, var(--brand) 12%, transparent);
        color: var(--brand);
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      p {
        margin: 10px 0 0;
        font-size: 0.875rem;
        line-height: 1.7;
        color: var(--ink-2);
      }
      .alt {
        margin-top: 4px;
        font-size: 0.8125rem;
        color: var(--ink-3);
      }
      button {
        margin-top: 28px;
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 999px;
        background: var(--brand);
        color: var(--on-brand);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 650;
        cursor: pointer;
      }
      button:active { transform: scale(0.99); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M5 12.5a10 10 0 0 1 14 0" />
          <path d="M8.5 16a5 5 0 0 1 7 0" />
          <path d="M12 20h.01" />
          <path d="M2 2l20 20" />
        </svg>
      </div>
      <h1>لا يوجد اتصال</h1>
      <p>المتجر بحاجة إلى إنترنت لعرض المنتجات وأسعارها. تحقق من الاتصال ثم أعد المحاولة.</p>
      <p class="alt" lang="en" dir="ltr">The shop needs a connection to show live products and prices.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة · Try again</button>
    </main>
    <script>
      // Match the reader's saved theme and language, the same two choices the
      // app itself restores before its first paint.
      try {
        if (localStorage.getItem("theme") === "dark")
          document.documentElement.classList.add("dark");
        if (localStorage.getItem("lang") === "en") {
          var root = document.documentElement;
          root.lang = "en";
          root.dir = "ltr";
          document.querySelector("h1").textContent = "No connection";
          document.querySelector("p").textContent =
            "The shop needs a connection to show live products and prices. Check yours, then try again.";
          document.querySelector(".alt").remove();
          document.querySelector("button").textContent = "Try again";
        }
      } catch (e) {}
    </script>
  </body>
</html>
